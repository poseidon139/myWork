    <!-- Blog Dynamic Loader with Search -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let allArticlesData = [];

            function renderArticles(articles) {
                const container = document.getElementById('all-articles');
                container.innerHTML = '';
                
                if (articles.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">No articles found matching your search.</p></div>';
                    return;
                }
                
                articles.forEach(article => {
                    const card = `
                        <div class="col-md-6 mb-4">
                            <article class="blog-item m3-card">
                                <md-elevation></md-elevation>
                                <p class="eyebrow">${article.date}</p>
                                <h2><a href="${article.filename}">${article.title}</a></h2>
                                <p>${article.description}</p>
                                <div class="mt-3">
                                    <md-text-button href="${article.filename}" trailing-icon>
                                        Read More
                                        <md-icon slot="icon">arrow_forward</md-icon>
                                    </md-text-button>
                                </div>
                            </article>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            }

            fetch('blog-data.json')
                .then(response => {
                    if (!response.ok) throw new Error("Could not find blog-data.json");
                    return response.json();
                })
                .then(articles => {
                    allArticlesData = articles;
                    renderArticles(articles);
                })
                .catch(error => {
                    console.error('Error fetching blog data:', error);
                    const container = document.getElementById('all-articles');
                    if (container) {
                        container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">Could not load articles. Please run "node generate_blog.js".</p></div>';
                    }
                });

            // Instant Search
            const searchField = document.getElementById('blog-search');
            if (searchField) {
                searchField.addEventListener('input', function(e) {
                    const query = (e.target.value || '').toLowerCase().trim();
                    if (!query) {
                        renderArticles(allArticlesData);
                        return;
                    }
                    const filtered = allArticlesData.filter(a => 
                        a.title.toLowerCase().includes(query) || 
                        a.description.toLowerCase().includes(query)
                    );
                    renderArticles(filtered);
                });
            }
        });
    </script>
