    <!-- Blog Dynamic Loader -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('blog-data.json')
                .then(response => {
                    if (!response.ok) throw new Error("Could not find blog-data.json");
                    return response.json();
                })
                .then(articles => {
                    const container = document.getElementById('all-articles');
                    container.innerHTML = ''; // clear loading state
                    
                    if (articles.length === 0) {
                        container.innerHTML = '<div class="col-12 text-center"><p>No articles found. Add some HTML files to the articles folder!</p></div>';
                        return;
                    }
                    
                    articles.forEach(article => {
                        const card = `
                            <div class="col-md-4 mb-4">
                                <div class="card border-0 shadow-sm h-100" style="border-radius: 12px; background: var(--bg-card); transition: transform 0.2s;">
                                    <div class="card-body p-4 d-flex flex-column">
                                        <p class="text-primary small font-weight-bold mb-2">${article.date}</p>
                                        <h5 class="card-title mb-3"><a href="${article.filename}" class="text-dark" style="text-decoration: none; font-weight: 700;">${article.title}</a></h5>
                                        <p class="card-text flex-grow-1 text-muted" style="font-size: 0.95rem;">${article.description}</p>
                                        <div class="mt-3">
                                            <a href="${article.filename}" class="text-primary font-weight-bold" style="text-decoration: none;">Read More &rarr;</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                })
                .catch(error => {
                    console.error('Error fetching blog data:', error);
                    const container = document.getElementById('all-articles');
                    if (container) {
                        container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">Could not load articles. Please run "node generate_blog.js".</p></div>';
                    }
                });
        });
    </script>
