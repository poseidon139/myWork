<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ac69"/>
      <stop offset="100%" stop-color="#c68642"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- subtle terminal grid dots -->
  <g opacity="0.15">
    <circle cx="30" cy="30" r="1.5" fill="#38bdf8"/>
    <circle cx="170" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="25" cy="170" r="1.5" fill="#38bdf8"/>
    <circle cx="175" cy="165" r="1.5" fill="#38bdf8"/>
    <circle cx="100" cy="20" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Hoodie body -->
  <path d="M40 200 C40 150 60 130 100 130 C140 130 160 150 160 200 Z" fill="#334155"/>
  <path d="M70 135 C80 150 120 150 130 135 L138 150 C120 165 80 165 62 150 Z" fill="#1e293b"/>

  <!-- Neck -->
  <rect x="88" y="115" width="24" height="25" fill="url(#skin)"/>

  <!-- Head -->
  <circle cx="100" cy="90" r="38" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M62 85 C60 55 78 45 100 45 C122 45 140 55 138 85 C132 70 120 62 100 62 C80 62 68 70 62 85 Z" fill="#2d2320"/>

  <!-- Ears -->
  <circle cx="63" cy="92" r="6" fill="url(#skin)"/>
  <circle cx="137" cy="92" r="6" fill="url(#skin)"/>

  <!-- Glasses -->
  <g stroke="#0f172a" stroke-width="3" fill="none">
    <rect x="70" y="86" width="24" height="18" rx="4"/>
    <rect x="106" y="86" width="24" height="18" rx="4"/>
    <line x1="94" y1="94" x2="106" y2="94"/>
    <line x1="66" y1="90" x2="70" y2="90"/>
    <line x1="130" y1="90" x2="134" y2="90"/>
  </g>
  <rect x="72" y="88" width="20" height="14" rx="3" fill="#38bdf8" opacity="0.25"/>
  <rect x="108" y="88" width="20" height="14" rx="3" fill="#38bdf8" opacity="0.25"/>

  <!-- Smile -->
  <path d="M90 112 Q100 118 110 112" stroke="#7c4a24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Code symbol on hoodie -->
  <text x="100" y="182" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
</svg>
